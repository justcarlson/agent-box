name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit-sha: ${{ steps.tag.outputs.commit-sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag
        id: tag
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$cargo_version" || "$GITHUB_REF_NAME" != "v${cargo_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${cargo_version}." >&2
            exit 1
          fi
          git fetch --force --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tagged commit ${tag_commit} is not an ancestor of origin/main." >&2
            exit 1
          fi
          echo "commit-sha=${tag_commit}" >> "$GITHUB_OUTPUT"
          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"

  quality:
    needs: verify-tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: [verify-tag, quality]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit-sha }}
          persist-credentials: false
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build static binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # musl-gcc builds rusqlite's bundled SQLite C code and links the binary.
          triple="${TARGET//-/_}"
          export "CC_${triple}=musl-gcc"
          export "CARGO_TARGET_${triple^^}_LINKER=musl-gcc"
          cargo build --release --locked --target "$TARGET"
      - name: Check the binary is static and runs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/${TARGET}/release/agent-box"
          file "$bin" | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'
          "$bin" --version
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # The binary sits at the archive root, as Cargo.toml's binstall bin-dir expects.
          tar -czf "agent-box-${TARGET}.tar.gz" -C "target/${TARGET}/release" agent-box
          tar -tzf "agent-box-${TARGET}.tar.gz" | grep -Fx agent-box
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-box-${{ matrix.target }}
          path: agent-box-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [verify-tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-box-*
          merge-multiple: true
      - name: Checksums
        run: |
          sha256sum agent-box-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            agent-box-*.tar.gz
            SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" agent-box-*.tar.gz SHA256SUMS \
            --generate-notes \
            --title "agent-box $GITHUB_REF_NAME" \
            --verify-tag
