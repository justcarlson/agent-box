<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 368" width="980" height="368" role="img" aria-label="agent-box architecture: host session stays untouched while agent-box up clones the browser profile via FICLONE and re-encrypts cookies into an isolated systemd slice">
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#a8a29e"/>
    </marker>
    <marker id="arrow-olive" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#a3e635"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="980" height="368" rx="14" fill="#161614" stroke="#2d2b27" stroke-width="1"/>

  <!-- Column 1: Host Session -->
  <text x="20" y="28" class="sans" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#a8a29e">HOST SESSION</text>

  <!-- Host Desktop Card -->
  <rect x="20" y="40" width="222" height="84" rx="10" fill="#1f1e1b" stroke="#38352f" stroke-width="1.25"/>
  <text x="34" y="64" class="sans" font-size="13" font-weight="700" fill="#f5f5f4">Host Desktop</text>
  <rect x="158" y="49" width="72" height="20" rx="10" fill="#1e2a14" stroke="#4d7c0f" stroke-width="1"/>
  <text x="194" y="62.5" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#bef264">Untouched</text>
  <text x="34" y="86" class="mono" font-size="11" fill="#d6d3d1">:0 / Wayland session</text>
  <text x="34" y="106" class="sans" font-size="11.5" fill="#a8a29e">Never drawn on or focused</text>

  <!-- Browser Profile Card -->
  <rect x="20" y="140" width="222" height="92" rx="10" fill="#1f1e1b" stroke="#38352f" stroke-width="1.25"/>
  <text x="34" y="165" class="sans" font-size="13" font-weight="700" fill="#f5f5f4">Browser Profile</text>
  <text x="34" y="187" class="mono" font-size="11" fill="#d6d3d1">~/.config/&lt;browser&gt;</text>
  <text x="34" y="207" class="sans" font-size="11.5" fill="#a8a29e">Read-only CoW source</text>
  <text x="34" y="222" class="sans" font-size="11" fill="#a8a29e">Never written to by boxes</text>

  <!-- Desktop Keyring Card -->
  <rect x="20" y="248" width="222" height="96" rx="10" fill="#1f1e1b" stroke="#38352f" stroke-width="1.25"/>
  <text x="34" y="273" class="sans" font-size="13" font-weight="700" fill="#f5f5f4">Desktop Keyring</text>
  <text x="34" y="295" class="mono" font-size="11" fill="#d6d3d1">secret-tool search</text>
  <text x="34" y="315" class="sans" font-size="11.5" fill="#a8a29e">Non-prompting v11 lookup</text>
  <text x="34" y="331" class="sans" font-size="11" fill="#a8a29e">Read once, zeroed in RAM</text>

  <!-- Connectors Host -> Clone -->
  <path d="M 242 186 L 268 186" stroke="#a8a29e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 242 296 L 268 296" stroke="#a8a29e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Column 2: One-time Clone Bridge -->
  <rect x="272" y="140" width="160" height="204" rx="10" fill="#261f12" stroke="#b45309" stroke-width="1.25"/>
  <text x="286" y="165" class="mono" font-size="12.5" font-weight="700" fill="#fcd34d">agent-box up</text>
  <text x="286" y="183" class="sans" font-size="11" font-weight="600" fill="#f59e0b">One-time clone (~2s)</text>
  <line x1="286" y1="194" x2="418" y2="194" stroke="#78350f" stroke-width="1"/>
  <text x="286" y="214" class="mono" font-size="10.5" font-weight="600" fill="#fef3c7">FICLONE CoW copy</text>
  <text x="286" y="232" class="sans" font-size="11" fill="#fde68a">Skips cache, history,</text>
  <text x="286" y="247" class="sans" font-size="11" fill="#fde68a">passwords, extensions</text>
  <text x="286" y="271" class="mono" font-size="10.5" font-weight="600" fill="#fef3c7">v11 -&gt; v10 cookies</text>
  <text x="286" y="289" class="sans" font-size="11" fill="#fde68a">Re-encrypted in RAM</text>
  <text x="286" y="313" class="sans" font-size="11" font-weight="600" fill="#fef3c7">Zero keyring access</text>
  <text x="286" y="328" class="sans" font-size="11" fill="#fde68a">inside the box</text>

  <!-- Connector Clone -> Slice -->
  <path d="M 432 242 L 458 242" stroke="#a3e635" stroke-width="1.75" fill="none" marker-end="url(#arrow-olive)"/>

  <!-- Column 3: Systemd User Slice -->
  <rect x="464" y="16" width="496" height="336" rx="12" fill="#1a2115" stroke="#65a30d" stroke-width="1.5"/>

  <!-- Slice Header -->
  <text x="480" y="42" class="mono" font-size="13.5" font-weight="700" fill="#bef264">agent-box-box1.slice</text>
  <rect x="752" y="25" width="192" height="22" rx="11" fill="#253319" stroke="#4d7c0f" stroke-width="1"/>
  <text x="848" y="39.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#d9f99d">MemoryHigh=3G · TTL 12h</text>
  <text x="480" y="61" class="mono" font-size="10.5" fill="#a3e635">env -i · ~/.cache/agent-box/box1 (0700) · ExecStopPost=__reap</text>

  <!-- Row 1: Desktop Stack Cards -->
  <!-- Card 1: Xvfb -->
  <rect x="480" y="76" width="148" height="106" rx="9" fill="#20251c" stroke="#3f502a" stroke-width="1.25"/>
  <text x="492" y="99" class="mono" font-size="12" font-weight="700" fill="#f5f5f4">Xvfb :100+</text>
  <text x="492" y="119" class="mono" font-size="10.5" fill="#d6d3d1">1440x900x24</text>
  <text x="492" y="139" class="sans" font-size="11" fill="#d6d3d1">MIT-MAGIC-COOKIE</text>
  <text x="492" y="157" class="sans" font-size="11" fill="#a8a29e">Avoids Xwayland :0</text>
  <text x="492" y="172" class="mono" font-size="10" fill="#a8a29e">-nolisten tcp</text>

  <!-- Card 2: D-Bus + AT-SPI -->
  <rect x="638" y="76" width="148" height="106" rx="9" fill="#20251c" stroke="#3f502a" stroke-width="1.25"/>
  <text x="650" y="99" class="sans" font-size="12.5" font-weight="700" fill="#f5f5f4">D-Bus + AT-SPI</text>
  <text x="650" y="119" class="sans" font-size="11" fill="#d6d3d1">Private session bus</text>
  <text x="650" y="139" class="sans" font-size="11" fill="#d6d3d1">No service activation</text>
  <text x="650" y="157" class="sans" font-size="11" fill="#a8a29e">No host portals or</text>
  <text x="650" y="172" class="sans" font-size="11" fill="#a8a29e">keyring daemon</text>

  <!-- Card 3: openbox -->
  <rect x="796" y="76" width="148" height="106" rx="9" fill="#20251c" stroke="#3f502a" stroke-width="1.25"/>
  <text x="808" y="99" class="mono" font-size="12" font-weight="700" fill="#f5f5f4">openbox</text>
  <text x="808" y="119" class="sans" font-size="11" fill="#d6d3d1">X11 window manager</text>
  <text x="808" y="139" class="sans" font-size="11" fill="#d6d3d1">Maximized windows</text>
  <text x="808" y="157" class="sans" font-size="11" fill="#a8a29e">Private focus inside</text>
  <text x="808" y="172" class="sans" font-size="11" fill="#a8a29e">the box only</text>

  <!-- Row 2: Browser & Control Surfaces -->
  <!-- Card 4: Browser + CDP -->
  <rect x="480" y="194" width="148" height="106" rx="9" fill="#17232b" stroke="#0369a1" stroke-width="1.25"/>
  <text x="492" y="217" class="sans" font-size="12.5" font-weight="700" fill="#7dd3fc">Browser + CDP</text>
  <text x="492" y="237" class="mono" font-size="9" fill="#bae6fd">--password-store=basic</text>
  <text x="492" y="255" class="mono" font-size="10" fill="#d6d3d1">--disable-sync</text>
  <text x="492" y="274" class="mono" font-size="10" fill="#38bdf8">127.0.0.1:&lt;port&gt;</text>
  <text x="492" y="290" class="sans" font-size="10.5" fill="#a8a29e">agent-browser / PW</text>

  <!-- Card 5: cua-driver -->
  <rect x="638" y="194" width="148" height="106" rx="9" fill="#17232b" stroke="#0369a1" stroke-width="1.25"/>
  <text x="650" y="217" class="mono" font-size="12" font-weight="700" fill="#7dd3fc">cua-driver</text>
  <text x="650" y="237" class="sans" font-size="11" fill="#bae6fd">Optional (--cua auto)</text>
  <text x="650" y="256" class="sans" font-size="11" fill="#d6d3d1">AX tree + GUI input</text>
  <text x="650" y="274" class="mono" font-size="10" fill="#d6d3d1">agent-box call</text>
  <text x="650" y="290" class="mono" font-size="10" fill="#a8a29e">cua.sock</text>

  <!-- Card 6: x11rb shot -->
  <rect x="796" y="194" width="148" height="106" rx="9" fill="#17232b" stroke="#0369a1" stroke-width="1.25"/>
  <text x="808" y="217" class="mono" font-size="12" font-weight="700" fill="#7dd3fc">x11rb shot</text>
  <text x="808" y="237" class="sans" font-size="11" fill="#bae6fd">Pure-Rust X11 PNG</text>
  <text x="808" y="256" class="sans" font-size="11" fill="#d6d3d1">Direct GetImage</text>
  <text x="808" y="274" class="mono" font-size="10" fill="#d6d3d1">agent-box shot</text>
  <text x="808" y="290" class="sans" font-size="10.5" fill="#a8a29e">Zero external tools</text>

  <!-- Footer Strip inside Slice -->
  <rect x="480" y="312" width="464" height="28" rx="6" fill="#253319" stroke="#4d7c0f" stroke-width="1"/>
  <text x="712" y="330" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#d9f99d">Native apps via agent-box run · Atomic slice cleanup on down, TTL, or crash</text>
</svg>
