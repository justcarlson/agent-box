[package]
name = "agent-box"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Parallel, disposable computer-use desktops for agents, each signed in like the user's main browser profile"

[dependencies]
aes = "0.8"
anyhow = "1"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
